    "issue stock": "Record stock going out of the store: to the dispensary, a ward, a customer or another branch.",
    "place order": "Record an order you've sent to a supplier, so you can track it until it arrives.",
    "stock rules": "Settings used to work out the safety stock and maximum stock for every product.",
    "supplies products": "The products you usually buy from this supplier.",
    "batch number on the pack": "The code printed on the pack that identifies the batch. You need it if there's a recall.",
    "quantity received": "How many units arrived in this delivery.",
    "date ordered": "The day you sent the order to the supplier. Used to work out the lead time.",
    "date received": "The day the goods arrived in your store.",
    "expected delivery": "The day you expect the goods to arrive, worked out from the lead time.",
    "issued to": "Where the stock went: the dispensary, a sale, a ward or another branch.",
    "contact person": "The person you deal with at the supplier's company.",
    "company name": "The name of the supplier's business.",
    "usual delivery time in days": "How many days this supplier normally takes to deliver after you order.",
    "phone number": "The number you call or WhatsApp to reach this supplier.",
    "product": "The medicine or item, with its strength and form.",
    "counted in": "The unit you count this product in: tablets, bottles, packs and so on.",
    "date": "The day it happened.",
    "pack": "A photo of this batch's pack, so staff can match the shelf to the record, even if the brand or packaging changes.",
    "scan the pack": "Photograph the pack and the AI reads the batch number, expiry date and name for you. On a capable laptop it works offline, on the device.",
    "use laptop camera": "Scan the pack with this computer's webcam instead of choosing a photo file.",
    "brand / manufacturer": "The brand name and the company that made this batch. The same medicine can come from different makers."
  };
  function termKey(text) {
    return text.toLowerCase().replace(/\([^)]*\)/g, " ").replace(/[0-9]/g, " ").replace(/[.:]+$/, "").replace(/\s+/g, " ").trim();
  }
  function applyTips(root) {
    root.querySelectorAll("h1, h2, h3, dt, th, .fact > span, .gauge-key span, .fefo-tag, .status-text, .filter, .supplied-head, .form label, .rules > p strong, .actions .btn").forEach((el) => {
      if (el.dataset.tip) return;
      const text = el.matches("label") ? (el.childNodes[0] && el.childNodes[0].textContent) || "" : el.textContent;
      const tip = GLOSSARY[termKey(text)];
      if (!tip) return;
      el.dataset.tip = tip;
      el.classList.add("term");
      if (!el.matches("a, button, label")) el.tabIndex = 0;
    });
  }
  const tipEl = document.createElement("div");
  tipEl.id = "tip"; tipEl.setAttribute("role", "tooltip"); tipEl.hidden = true;
  document.body.appendChild(tipEl);
  let tipFor = null;
  function showTip(el) {
    tipFor = el;
    tipEl.textContent = el.dataset.tip; tipEl.hidden = false;
    const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
    let top = r.bottom + 8;
    if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 8);
    tipEl.style.left = left + "px"; tipEl.style.top = top + "px";
  }
  function hideTip() { tipEl.hidden = true; tipFor = null; }
  document.addEventListener("mouseover", (e) => { const el = e.target.closest("[data-tip]"); if (el) showTip(el); });
  document.addEventListener("mouseout", (e) => { const el = e.target.closest("[data-tip]"); if (el && !el.contains(e.relatedTarget)) hideTip(); });
  document.addEventListener("focusin", (e) => { const el = e.target.closest("[data-tip]"); if (el) showTip(el); else hideTip(); });
  document.addEventListener("focusout", hideTip);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideTip(); });
  window.addEventListener("scroll", () => { if (tipFor) hideTip(); }, { passive: true });
  new MutationObserver(() => { applyTips(view); fillPhotos(view); }).observe(view, { childList: true, subtree: true });
  view.addEventListener("click", (e) => {
    const b = e.target.closest("[data-open]");
    if (!b) return;
    const batch = db.batches.find((x) => x.id === b.dataset.open);
    const prod = batch && productById(batch.productId);
    openPhoto(b.dataset.open, prod ? prod.name + ", batch " + batch.batchNo + (batch.brand ? " (" + batch.brand + ")" : "") : "Pack photo");
  });

  /* ---------- Routing ---------- */
  function updateCount() {
    const n = flaggedBatches().filter((b) => statusOf(b.expiry) !== "m6").length + db.products.filter(needsReorder).length;
    const el = document.getElementById("reminder-count");
    el.textContent = n; el.hidden = n === 0;
    el.setAttribute("aria-label", n + " urgent");
  }
  function route() {
    const parts = (location.hash || "#/stock").slice(2).split("/");
    const page = parts[0] || "stock";
    document.querySelectorAll(".tabs a").forEach((a) => {
      if (a.dataset.tab === page || (["product", "receive", "issue", "order"].includes(page) && a.dataset.tab === "stock")) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
    if (page === "product") renderProduct(parts[1]);
    else if (page === "receive") renderReceive(parts[1], parts[2]);
    else if (page === "order") renderOrder(parts[1]);
    else if (page === "issue") renderIssue(parts[1]);
    else if (page === "reminders") renderReminders();
    else if (page === "suppliers") renderSuppliers();
    else renderStock();
    updateCount();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", () => { route(); view.focus({ preventScroll: true }); });
  try { if (!localStorage.getItem(STORE_KEY)) save(); } catch (e) { /* storage unavailable */ }
  if (navigator.onLine && location.protocol.startsWith("http")) setTimeout(() => loadAI().catch(() => {}), 1500);
  route();
})();

</script>
</body>
</html>
